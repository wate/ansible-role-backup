# code: language=ansible
---
- name: Test backup script:test_command_and_restic
  block:
    - name: Check backup script:test_command_and_restic
      ansible.builtin.stat:
        path: "{{ backup_script_dir }}/test_command_and_restic"
      register: backup_script_result
    - name: Assert backup script:test_command_and_restic
      ansible.builtin.assert:
        that:
          - backup_script_result.stat.exists
          - backup_script_result.stat.isreg
          - backup_script_result.stat.pw_name == 'command_and_restic'
          - backup_script_result.stat.gr_name == 'command_and_restic'
          - backup_script_result.stat.executable
        fail_msg: "Backup script for test_command_and_restic is not properly configured"
        success_msg: "Backup script for test_command_and_restic is properly configured"
- name: Test backup data directory:test_command_and_restic
  block:
    - name: Check backup data directory:test_command_and_restic
      ansible.builtin.stat:
        path: "{{ backup_data_dir }}/test_command_and_restic"
      register: backup_data_dir_result
    - name: Assert backup data directory:test_command_and_restic
      ansible.builtin.assert:
        that:
          - backup_data_dir_result.stat.exists
          - backup_data_dir_result.stat.isdir
          - backup_data_dir_result.stat.writeable
          - backup_data_dir_result.stat.pw_name == 'command_and_restic'
          - backup_data_dir_result.stat.gr_name == 'command_and_restic'
        fail_msg: "Backup data directory for test_command_and_restic is not properly configured"
        success_msg: "Backup data directory for test_command_and_restic is properly configured"
- name: Test repository password file:test_command_and_restic
  block:
    - name: Check repository password file:test_command_and_restic
      ansible.builtin.stat:
        path: "{{ backup_repo_password_dir }}/test_command_and_restic"
      register: repo_password_file_result
    - name: Assert repository password file:test_command_and_restic
      ansible.builtin.assert:
        that:
          - repo_password_file_result.stat.exists
          - repo_password_file_result.stat.isreg
          - repo_password_file_result.stat.writeable
          - repo_password_file_result.stat.pw_name == 'command_and_restic'
          - repo_password_file_result.stat.gr_name == 'command_and_restic'
          - repo_password_file_result.stat.mode == '0640'
        fail_msg: "Repository password file for test_command_and_restic is not properly configured"
        success_msg: "Repository password file for test_command_and_restic is properly configured"
- name: Test repository directory:test_command_and_restic
  block:
    - name: Check repository directory:test_command_and_restic
      ansible.builtin.stat:
        path: "{{ backup_repo_dir }}/test_command_and_restic"
      register: backup_repo_dir_result
    - name: Assert repository directory:test_command_and_restic
      ansible.builtin.assert:
        that:
          - backup_repo_dir_result.stat.exists
          - backup_repo_dir_result.stat.isdir
          - backup_repo_dir_result.stat.writeable
          - backup_repo_dir_result.stat.pw_name == 'command_and_restic'
          - backup_repo_dir_result.stat.gr_name == 'command_and_restic'
          - backup_repo_dir_result.stat.mode == '0750'
        fail_msg: "Repository directory for test_command_and_restic is not properly configured"
        success_msg: "Repository directory for test_command_and_restic is properly configured"
- name: Test cron setting:test_command_and_restic
  block:
    - name: Check cron setting:test_command_and_restic
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          crontab -l | grep "#Ansible: role:backup/setting:test_command_and_restic"
        executable: /bin/bash
      failed_when: cron_setting_result.rc > 1
      changed_when: false
      register: cron_setting_result
    - name: Assert cron setting:test_command_and_restic
      ansible.builtin.assert:
        that: cron_setting_result.rc == 0
        fail_msg: "Cron setting for test_command_and_restic is not configured"
        success_msg: "Cron setting for test_command_and_restic is properly configured"
- name: Test backup script detail:test_command_and_restic
  block:
    - name: Check backup command section:test_command_and_restic
      ansible.builtin.command:
        cmd: grep "rclone test makefile 1234" "{{ backup_script_dir }}/test_command_and_restic"
      failed_when: backup_command_result.rc > 1
      changed_when: false
      register: backup_command_result
    - name: Assert backup command:test_command_and_restic
      ansible.builtin.assert:
        that: backup_command_result.rc == 0
        fail_msg: "Backup command validation for test_command_and_restic failed"
        success_msg: "Backup command for test_command_and_restic is properly configured"
    - name: Execute backup script:test_command_and_restic
      ansible.builtin.command:
        cmd: "{{ backup_script_dir }}/test_command_and_restic"
      changed_when: false
      register: exec_backup_script_result
    - name: Assert execute backup script result:test_command_and_restic
      ansible.builtin.assert:
        that: exec_backup_script_result.rc == 0
        fail_msg: "Backup script execution for test_command_and_restic failed"
        success_msg: "Backup script for test_command_and_restic executed successfully"
    - name: Check backup script generated file:test_command_and_restic
      ansible.builtin.stat:
        path: "{{ backup_data_dir }}/test_command_and_restic/test.txt"
      register: backup_script_generated_file_result
    - name: Assert backup script generated file:test_command_and_restic
      ansible.builtin.assert:
        that:
          - backup_script_generated_file_result.stat.exists
          - backup_script_generated_file_result.stat.isreg
          - backup_script_generated_file_result.stat.pw_name == 'command_and_restic'
        fail_msg: "Backup script generated file for test_command_and_restic is not properly created"
        success_msg: "Backup script generated file for test_command_and_restic is properly created"
