# code: language=ansible
---
- name: Test backup script:test_no_schedule
  block:
    - name: Check backup script:test_no_schedule
      ansible.builtin.stat:
        path: "{{ backup_script_dir }}/test_no_schedule"
      register: backup_script_result
    - name: Assert backup script:test_no_schedule
      ansible.builtin.assert:
        that:
          - backup_script_result.stat.exists
          - backup_script_result.stat.isreg
          - backup_script_result.stat.pw_name == 'no_schedule'
          - backup_script_result.stat.gr_name == 'no_schedule'
          - backup_script_result.stat.executable
        fail_msg: "Backup script for test_no_schedule is not properly configured"
        success_msg: "Backup script for test_no_schedule is properly configured"
- name: Test backup data directory:test_no_schedule
  block:
    - name: Check backup data directory:test_no_schedule
      ansible.builtin.stat:
        path: "{{ backup_data_dir }}/test_no_schedule"
      register: backup_data_dir_result
    - name: Assert backup data directory:test_no_schedule
      ansible.builtin.assert:
        that:
          - backup_data_dir_result.stat.exists
          - backup_data_dir_result.stat.isdir
          - backup_data_dir_result.stat.writeable
          - backup_data_dir_result.stat.pw_name == 'no_schedule'
          - backup_data_dir_result.stat.gr_name == 'no_schedule'
        fail_msg: "Backup data directory for test_no_schedule is not properly configured"
        success_msg: "Backup data directory for test_no_schedule is properly configured"
- name: Test repository password file:test_no_schedule
  block:
    - name: Check repository password file:test_no_schedule
      ansible.builtin.stat:
        path: "{{ backup_repo_password_dir }}/test_no_schedule"
      register: repo_password_file_result
    - name: Assert repository password file:test_no_schedule
      ansible.builtin.assert:
        that:
          - repo_password_file_result.stat.exists
          - repo_password_file_result.stat.isreg
          - repo_password_file_result.stat.writeable
          - repo_password_file_result.stat.pw_name == 'no_schedule'
          - repo_password_file_result.stat.gr_name == 'no_schedule'
          - repo_password_file_result.stat.mode == '0640'
        fail_msg: "Repository password file for test_no_schedule is not properly configured"
        success_msg: "Repository password file for test_no_schedule is properly configured"
- name: Test repository directory:test_no_schedule
  block:
    - name: Check repository directory:test_no_schedule
      ansible.builtin.stat:
        path: "{{ backup_repo_dir }}/test_no_schedule"
      register: backup_repo_dir_result
    - name: Assert repository directory:test_no_schedule
      ansible.builtin.assert:
        that:
          - backup_repo_dir_result.stat.exists
          - backup_repo_dir_result.stat.isdir
          - backup_repo_dir_result.stat.writeable
          - backup_repo_dir_result.stat.pw_name == 'no_schedule'
          - backup_repo_dir_result.stat.gr_name == 'no_schedule'
          - backup_repo_dir_result.stat.mode == '0750'
        fail_msg: "Repository directory for test_no_schedule is not properly configured"
        success_msg: "Repository directory for test_no_schedule is properly configured"
- name: Test cron setting:test_no_schedule
  block:
    - name: Check cron setting:test_no_schedule
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          crontab -l | grep "#Ansible: role:backup/setting:test_no_schedule"
        executable: /bin/bash
      failed_when: cron_setting_result.rc > 1
      changed_when: false
      register: cron_setting_result
    - name: Assert cron setting:test_no_schedule
      ansible.builtin.assert:
        that: cron_setting_result.rc == 1
        fail_msg: "Cron setting for test_no_schedule should not exist"
        success_msg: "Cron setting for test_no_schedule correctly not configured"
